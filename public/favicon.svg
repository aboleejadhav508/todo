<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Matches the in-app brand mark: white list-todo glyph on the accent tile.
       An explicit fill/stroke is required here — a favicon has no inherited
       colour, so `currentColor` would render black and vanish on dark tab bars. -->
  <rect width="32" height="32" rx="7.5" fill="#e9631a" />
  <g transform="translate(4 4)" fill="none" stroke="#ffffff" stroke-width="2.6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 5h8" />
    <path d="M13 12h8" />
    <path d="M13 19h8" />
    <path d="m3 17 2 2 4-4" />
    <rect x="3" y="4" width="6" height="6" rx="1" />
  </g>
</svg>
